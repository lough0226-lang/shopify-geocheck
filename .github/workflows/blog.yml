name: blog

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集 → 出选题卡
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BAILIAN_MODEL: ${{ vars.BAILIAN_MODEL || 'qwen-plus' }}
        run: node scripts/blog/run.mjs

      - name: 有新卡就开 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain blog-briefs/)" ]; then
            echo "今天没有新选题卡，不提交。"
            exit 0
          fi

          BRANCH="blog/brief-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name  "geo-blog-bot"
          git config user.email "bot@mygeocheck.com"
          git checkout -B "$BRANCH"
          git add blog-briefs/
          git commit -m "blog: 选题卡 $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "选题卡 $(date -u +%Y-%m-%d)" \
            --body "自动生成的选题卡：来源、可引用的事实原句、角度建议、坑。下一步：挑一条让我写正文。"
